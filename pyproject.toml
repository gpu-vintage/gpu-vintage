[project]
name = "gpuvintage"
version = "0.1.0"
description = "Throughput and energy of LLM inference across GPU generations, and the economics of GPU vintages"
requires-python = ">=3.10,<3.14"   # torch 2.6.0+cu124 has wheels for 3.9 to 3.13 only
dependencies = [
    "torch==2.6.0",
    "safetensors>=0.4",
    # huggingface_hub 0.32 and later pull hf-xet; stay below it so that the
    # environment also installs on glibc 2.17 (CentOS 7).
    "huggingface_hub>=0.30,<0.32",
    "nvidia-ml-py>=12.535",
    # numpy 2.3 and later ship manylinux_2_28 wheels only (not on glibc 2.17).
    "numpy>=1.26,<2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "transformers==4.51.3",   # the reference implementation in the tests (Qwen3 needs >= 4.51)
]
analysis = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpuvintage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU",
    "slow: takes more than a few seconds",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
